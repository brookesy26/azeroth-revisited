name: Refresh published content
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify site"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: published-content-refresh
  cancel-in-progress: false
jobs:
  request-build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Cloudflare Pages refresh
        env:
          BUILD_HOOK: ${{ secrets.CLOUDFLARE_PAGES_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo 'Configure the CLOUDFLARE_PAGES_BUILD_HOOK repository secret to enable published refreshes.'
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$BUILD_HOOK"
